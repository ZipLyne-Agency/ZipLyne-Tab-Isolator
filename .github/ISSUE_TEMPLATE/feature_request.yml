name: Feature request
description: Propose a focused extension or compatibility improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or isolation gap should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Security and compatibility boundary
      description: Which browser APIs, permissions, or fail-closed behavior would change?
    validations:
      required: true
