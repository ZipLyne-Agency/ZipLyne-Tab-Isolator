<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZipLyne Tab Isolator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="logo" aria-hidden="true">W</div>
        <div>
          <h1>Sessions</h1>
        </div>
      </header>

      <section id="status" class="status" role="status" hidden></section>
      <section id="sessions" class="sessions" aria-label="Sessions"></section>

      <form id="site-form" class="site-form">
        <label class="field">
          <span>New site</span>
          <input id="site-domain" maxlength="253" placeholder="claude.ai" autocomplete="off" required>
        </label>
        <button type="submit" class="secondary">Add site</button>
      </form>

      <footer>
        <button id="diagnostics" type="button" class="link-button">Diagnostics</button>
        <span id="tab-count">0 controlled tabs</span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
